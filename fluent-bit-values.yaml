# Fluent Bit values.yaml
config:
  inputs: |
    [INPUT]
        Name           tail
        Tag            kube.*
        Path           /var/log/pods/*/*/*.log
        Parser         docker
        Docker_Mode    On
        Mem_Buf_Limit  50MB
        Skip_Long_Lines On

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://default.svc
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.pods.
        Merge_Log           On
        Keep_Log            Off

  outputs: |
    [OUTPUT]
        Name            otlp
        Match           *
        # Point to your central OTel Collector Gateway Service
        Host            my-opentelemetry-collector.observability.svc.cluster.local
        Port            4318
        Format          json
