apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bookinfo
  namespace: argocd
  labels:
    name: bookinfo
spec:
  project: default

  source:
    repoURL: https://github.com/phongtr27/microservices-demo.git
    targetRevision: dev
    path: kubernetes-manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  ignoreDifferences:
  - group: networking.istio.io
    kind: VirtualService
    jsonPointers:
    # Ignores changes made to weights under all routing configurations
    - /spec/http/*/route/*/weight

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - Validate=false
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    - RespectIgnoreDifferences=true
    - ApplyOutOfSyncOnly=true
    - SkipDryRunOnMissingResource=true
    - Replace=true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 10