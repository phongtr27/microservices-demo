mode: deployment

podAnnotations:
  sidecar.istio.io/inject: "false"

image:
  repository: otel/opentelemetry-collector-contrib

config:
  receivers:
    jaeger: null
    prometheus: null
    zipkin: null
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    memory_limiter:
      check_interval: 1s
      limit_percentage: 75
      spike_limit_percentage: 15
    batch:
      send_batch_size: 8192
      timeout: 5s
      send_batch_max_size: 10240

    # --- INJECTED PRODUCTION TRANSFORMATION ENGINE ---
    transform:
      error_mode: ignore
      log_statements:
        - context: log
          statements:
            # 1. Map standard resource attributes if present
            - set(attributes["k8s_namespace_name"], resource.attributes["k8s.namespace.name"]) where resource.attributes["k8s.namespace.name"] != nil
            - set(attributes["k8s_pod_name"], resource.attributes["k8s.pod.name"]) where resource.attributes["k8s.pod.name"] != nil

            # 2. Fallback: Parse flattened attribute objects sent by Fluent Bit
            - set(attributes["k8s_namespace_name"], attributes["kubernetes.namespace_name"]) where attributes["kubernetes.namespace_name"] != nil
            - set(attributes["k8s_pod_name"], attributes["kubernetes.pod_name"]) where attributes["kubernetes.pod_name"] != nil

            # 3. Baseline tag so the OTLP streams can always be found broadly
            - set(attributes["exporter"], "OTLP")

  exporters:
    debug:
      verbosity: detailed
    otlp/tempo:
      endpoint: "tempo.observability.svc.cluster.local:4317"
      tls:
        insecure: true

    otlphttp/loki:
      endpoint: http://loki.observability.svc.cluster.local:3100/otlp
      tls:
        insecure: true

  service:
    pipelines:
      traces:
        receivers:
          - otlp
        processors:
          - batch
        exporters:
          - debug
          - otlp/tempo
      metrics: null
      logs:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - transform
          - batch
        exporters:
          - debug
          - otlphttp/loki

ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false