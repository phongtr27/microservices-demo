mode: deployment

podAnnotations:
  sidecar.istio.io/inject: "false"

image:
  repository: otel/opentelemetry-collector-contrib

config:
  receivers:
    jaeger: null
    prometheus: null
    zipkin: null
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch: {}

  exporters:
    debug:
      verbosity: detailed
    otlp/tempo:
      endpoint: "tempo.observability.svc.cluster.local:4317"
      tls:
        insecure: true

    loki:
      endpoint: "loki-gateway.observability.svc.cluster.local"
      default_labels_enabled:
        exporter: true
        job: true

  service:
    pipelines:
      traces:
        receivers:
          - otlp
        processors:
          - batch
        exporters:
          - debug
          - otlp/tempo
      metrics: null
      logs:
        receivers:
          - otlp
        processors:
          - batch
        exporters:
          - debug
          - loki

ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false