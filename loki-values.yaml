deploymentMode: Distributed

minio:
  enabled: false

loki:
  auth_enabled: false

  # 1. HELM VALIDATION LAYER (camelCase)
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h

  # 2. RUNTIME STORAGE CONNECTION (camelCase)
  storageConfig:
    aws:
      s3: "s3://minioadmin:supersecretkey@loki-minio.observability.svc.cluster.local:9000/chunks"
      s3forcepathstyle: true
      insecure: true

  # 3. BUCKET MAPPING BLOCK (Required by workloads like ruler/ingester)
  storage:
    type: s3
    bucketNames:
      chunks: chunks

  limits_config:
    allow_structured_metadata: true
