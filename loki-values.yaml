deploymentMode: Distributed

minio:
  enabled: false

loki:
  auth_enabled: false

  # 1. HELM VALIDATION LAYER (Uses camelCase)
  schemaConfig:
    configs:
      - from: "2024-04-01"            # A date in the past so it activates immediately
        store: tsdb                  # Required for OpenTelemetry / Structured metadata
        object_store: s3             # Maps to the s3 block below
        schema: v13                  # Required by modern Loki versions
        index:
          prefix: index_
          period: 24h

  # 2. RUNTIME STORAGE LAYER (Uses camelCase)
  storageConfig:
    aws:
      s3: "s3://minioadmin:supersecretkey@loki-minio.observability.svc.cluster.local:9000/chunks"
      s3forcepathstyle: true
      insecure: true

  limits_config:
    allow_structured_metadata: true
