deploymentMode: SingleBinary

# Scale down the distributed microservice engine footprint
singleBinary:
  replicas: 1

minio:
  enabled: false

loki:
  auth_enabled: false

  # 1. HELM VALIDATION LAYER (camelCase)
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h

  # 2. RUNTIME STORAGE CONNECTION (Pointing to SeaweedFS)
  storageConfig:
    aws:
      endpoint: "local-s3-s3.observability.svc.cluster.local:8333"
      s3forcepathstyle: true
      insecure: true
      region: "us-east-1"
      access_key_id: "seaweedfs"
      secret_access_key: "seaweedfs"

  # 3. BUCKET MAPPING BLOCK
  storage:
    type: s3
    bucketNames:
      chunks: chunks
      ruler: ruler

  limits_config:
    allow_structured_metadata: true

# 4. Turn off heavy separate caching components to save cluster RAM
chunksCache:
  persistence:
    enabled: false
resultsCache:
  persistence:
    enabled: false
