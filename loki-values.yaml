deploymentMode: Distributed

minio:
  enabled: false

loki:
  auth_enabled: false

  # 1. HELM VALIDATION LAYER (camelCase)
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h

  # 2. RUNTIME STORAGE CONNECTION (Updated for SeaweedFS)
  storageConfig:
    aws:
      # Explicit endpoint pointing to the SeaweedFS S3-compatible service port
      endpoint: "local-s3-s3.observability.svc.cluster.local:8333"
      s3forcepathstyle: true
      insecure: true
      # SeaweedFS needs non-empty placeholder credential strings to satisfy the driver
      access_key_id: "seaweedfs"
      secret_access_key: "seaweedfs"

  # 3. BUCKET MAPPING BLOCK (SeaweedFS auto-creates buckets on first write)
  storage:
    type: s3
    bucketNames:
      chunks: chunks
      ruler: ruler

  limits_config:
    allow_structured_metadata: true
