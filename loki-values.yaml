deploymentMode: Distributed

minio:
  enabled: true
  persistence:
    size: 10Gi

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 2

  schema_config:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h

  storage:
    type: s3
    s3:
      endpoint: "loki-minio.observability.svc.cluster.local:9000"
      bucketnames: chunks
      secretAccessKey: "supersecretkey"
      accessKeyId: "minioadmin"
      insecure: true
      s3ForcePathStyle: true

  limits_config:
    allow_structured_metadata: true
